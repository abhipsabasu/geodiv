<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEODIV: Framework for Measuring Geographical Diversity in Text-to-Image Models</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 30px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .authors {
            font-size: 1.2em;
            color: #555;
            margin-top: 20px;
        }

        .authors span {
            display: inline-block;
            margin: 0 10px;
        }

        .authors span:not(:last-child)::after {
            content: ',';
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .authors {
                font-size: 1em;
            }

            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GEODIV: FRAMEWORK FOR MEASURING GEOGRAPHICAL DIVERSITY IN TEXT-TO-IMAGE MODELS</h1>
            <div class="authors">
                <span>Abhipsa Basu</span>
                <span>Mohana Singh</span>
                <span>Shashank Agnihotri</span>
                <span>Margret Keuper</span>
                <span>R. Venkatesh Babu</span>
            </div>
        </header>
    </div>
</body>
</html>
